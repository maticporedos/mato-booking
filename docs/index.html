<style>
  :root {
    --bg: #0B0B0B;
    --card: #161616;
    --card-hover: #1E1E1E;
    --border: #262626;
    --text: #FFFFFF;
    --muted: #A3A3A3;
    --red: #E10600;
    --red-hover: #FF1F14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }

  /* brez fotografije: velik napis na crnem z rdecim sijem zgoraj */
  .hero {
    position: relative; text-align: center; padding: 84px 16px 30px;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(225, 6, 0, .22), transparent 70%);
  }
  .scissors { width: 46px; height: 46px; margin: 0 auto 18px; color: var(--red); }
  h1 { font-family: 'Archivo Black', sans-serif; font-weight: 400; line-height: .95; letter-spacing: .01em; }
  h1 .w1 { display: block; font-size: clamp(3rem, 15vw, 4.4rem); }
  h1 .w2 { display: block; font-size: clamp(2.2rem, 11vw, 3.2rem); color: var(--red); }
  .tagline { margin-top: 16px; color: var(--muted); font-size: .74rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; }

  main { max-width: 460px; margin: 0 auto; padding: 4px 16px 40px; }

  .socials { display: flex; justify-content: center; gap: 12px; margin: 0 0 22px; }
  .socials a {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: grid; place-items: center; transition: border-color .15s, color .15s;
  }
  .socials a:hover { border-color: var(--red); color: var(--red); }
  .socials svg { width: 20px; height: 20px; fill: currentColor; }

  .cta {
    display: flex; align-items: center; gap: 14px;
    background: var(--red); border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 8px 28px rgba(225, 6, 0, .28); transition: background .15s, transform .15s;
  }
  .cta:hover { background: var(--red-hover); transform: translateY(-1px); }
  .cta .icon { font-size: 1.4rem; }
  .cta .label { flex: 1; }
  .cta strong { display: block; font-size: 1.02rem; font-weight: 800; }
  .cta span { display: block; font-size: .82rem; opacity: .9; margin-top: 2px; }
  .cta .arrow { font-size: 1.3rem; font-weight: 700; }

  .note { margin-top: 12px; text-align: center; color: var(--muted); font-size: .8rem; }

  h2 {
    font-family: 'Archivo Black', 'Inter', sans-serif; font-weight: 400;
    font-size: .8rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--red); margin: 32px 0 12px;
  }
  .link {
    display: flex; align-items: center; gap: 14px; margin-top: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px;
    transition: background .15s, border-color .15s;
  }
  .link:hover { background: var(--card-hover); border-color: #3a3a3a; }
  .link .icon { font-size: 1.2rem; }
  .link .label { flex: 1; }
  .link strong { display: block; font-size: .95rem; }
  .link span { display: block; color: var(--muted); font-size: .82rem; }
  .pm { font-family: 'Archivo Black', sans-serif; font-weight: 400; letter-spacing: .02em; }
  .pm i { font-style: normal; color: var(--red); }

  footer { margin-top: 36px; text-align: center; color: #6B6B6B; font-size: .75rem; letter-spacing: .04em; }
</style>
</head>
